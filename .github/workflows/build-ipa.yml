name: Build unsigned IPA

# 编译未签名的 .ipa（无需 Apple 开发者账号）。
# 触发方式：推送到 main 分支，或在 Actions 页面手动点 Run workflow。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure CocoaPods
        run: which pod || sudo gem install cocoapods

      - name: Install pods
        run: pod install

      - name: Build app (no signing)
        run: |
          xcodebuild \
            -workspace SafeVision.xcworkspace \
            -scheme SafeVision \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App found at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SafeVision-unsigned.ipa Payload
          ls -lh SafeVision-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeVision-unsigned-ipa
          path: SafeVision-unsigned.ipa
          if-no-files-found: error
